<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PoseNet Posture Detection</title>
    <!-- Load p5.js first -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.0/lib/p5.js"></script>
    <!-- Load ml5.js 0.12.2 (PoseNet is not available in ml5@latest / v1.0+) -->
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* React Bits Waves background canvas */
        #waves-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Header / Brand */
        .header-container {
            position: relative;
            z-index: 2;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 40%, #cccccc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
        }

        /* 50% of screen width & centered camera canvas */
        canvas:not(#waves-canvas) {
            position: relative;
            z-index: 2;
            width: 50vw !important;
            height: auto !important;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.15), 0 25px 60px rgba(0, 0, 0, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        canvas:not(#waves-canvas):hover {
            box-shadow: 0 0 55px rgba(255, 255, 255, 0.3), 0 25px 60px rgba(0, 0, 0, 0.95);
            border-color: rgba(255, 255, 255, 0.4);
        }
    </style>
    <script src='sketch.js'></script>
</head>

<body>
    <!-- React Bits Waves Background Canvas -->
    <canvas id="waves-canvas"></canvas>

    <div class="header-container">
        <h1>PoseNet Posture Detection</h1>
    </div>

    <!-- React Bits Waves Animation Engine -->
    <script>
        (function () {
            const canvas = document.getElementById('waves-canvas');
            const ctx = canvas.getContext('2d');

            // Waves Configuration (React Bits)
            const lineColor = 'rgba(255, 255, 255, 0.25)'; // Crisp White wave lines
            const backgroundColor = '#000000';             // Solid Black background
            const waveSpeedX = 0.012;
            const waveSpeedY = 0.01;
            const waveAmpX = 38;
            const waveAmpY = 22;
            const xGap = 13;
            const yGap = 34;
            const friction = 0.925;
            const tension = 0.005;
            const maxCursorForce = 180;

            let width, height;
            let rows, cols;
            let points = [];
            let time = 0;
            let animationFrameId;

            const mouse = {
                x: -1000,
                y: -1000,
                vx: 0,
                vy: 0,
                lastX: -1000,
                lastY: -1000
            };

            class Point {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.ox = x;
                    this.oy = y;
                    this.vx = 0;
                    this.vy = 0;
                }

                update(t) {
                    // Base sinusoidal wave motion
                    const targetX = this.ox + Math.sin(t * waveSpeedX + this.oy * 0.01) * waveAmpX;
                    const targetY = this.oy + Math.cos(t * waveSpeedY + this.ox * 0.01) * waveAmpY;

                    // Spring physics to return to wave trajectory
                    const forceX = (targetX - this.x) * tension;
                    const forceY = (targetY - this.y) * tension;

                    this.vx = (this.vx + forceX) * friction;
                    this.vy = (this.vy + forceY) * friction;

                    this.x += this.vx;
                    this.y += this.vy;

                    // Interactive cursor repulsion
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < maxCursorForce && dist > 0) {
                        const power = (1 - dist / maxCursorForce) * 14;
                        this.x += (dx / dist) * power + mouse.vx * 0.18;
                        this.y += (dy / dist) * power + mouse.vy * 0.18;
                    }
                }
            }

            function initGrid() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;

                rows = Math.floor(height / yGap) + 2;
                cols = Math.floor(width / xGap) + 2;
                points = [];

                const startX = (width - (cols - 1) * xGap) / 2;
                const startY = (height - (rows - 1) * yGap) / 2;

                for (let i = 0; i < rows; i++) {
                    const row = [];
                    for (let j = 0; j < cols; j++) {
                        const x = startX + j * xGap;
                        const y = startY + i * yGap;
                        row.push(new Point(x, y));
                    }
                    points.push(row);
                }
            }

            function render() {
                time += 1;

                ctx.fillStyle = backgroundColor;
                ctx.fillRect(0, 0, width, height);

                ctx.strokeStyle = lineColor;
                ctx.lineWidth = 1;

                // Update spring physics for each grid node
                for (let i = 0; i < rows; i++) {
                    for (let j = 0; j < cols; j++) {
                        points[i][j].update(time);
                    }
                }

                // Draw undulating horizontal wave lines (React Bits silk style)
                for (let i = 0; i < rows; i++) {
                    ctx.beginPath();
                    for (let j = 0; j < cols; j++) {
                        const p = points[i][j];
                        if (j === 0) {
                            ctx.moveTo(p.x, p.y);
                        } else {
                            ctx.lineTo(p.x, p.y);
                        }
                    }
                    ctx.stroke();
                }

                // Draw vertical wave structure
                for (let j = 0; j < cols; j++) {
                    ctx.beginPath();
                    for (let i = 0; i < rows; i++) {
                        const p = points[i][j];
                        if (i === 0) {
                            ctx.moveTo(p.x, p.y);
                        } else {
                            ctx.lineTo(p.x, p.y);
                        }
                    }
                    ctx.stroke();
                }

                // Decay cursor velocity
                mouse.vx *= 0.85;
                mouse.vy *= 0.85;

                animationFrameId = requestAnimationFrame(render);
            }

            window.addEventListener('resize', initGrid);

            window.addEventListener('mousemove', (e) => {
                mouse.vx = e.clientX - mouse.lastX;
                mouse.vy = e.clientY - mouse.lastY;
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.lastX = e.clientX;
                mouse.lastY = e.clientY;
            });

            window.addEventListener('mouseleave', () => {
                mouse.x = -1000;
                mouse.y = -1000;
                mouse.vx = 0;
                mouse.vy = 0;
            });

            initGrid();
            render();
        })();
    </script>
</body>

</html>
